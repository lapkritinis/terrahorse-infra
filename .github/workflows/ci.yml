name: CI
on: [pull_request, push]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: |
          sh -n scripts/*.sh
          for file in scripts/*.mjs; do node --check "$file"; done
          APP_VERSION=test E2E_TUNNEL_CONFIG_FILE=/tmp/config E2E_TUNNEL_CREDENTIALS_FILE=/tmp/credentials docker compose -f compose.e2e.yml config --quiet
